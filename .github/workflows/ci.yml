name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Checkstyle + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Checkstyle
        working-directory: backend
        run: ./mvnw -B checkstyle:check

      - name: Test
        working-directory: backend
        run: ./mvnw -B test

  frontend:
    name: Frontend (Lint + Test + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build (includes type-check)
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: snsapp
          POSTGRES_USER: snsapp
          POSTGRES_PASSWORD: snsapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U snsapp"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Build backend jar
        working-directory: backend
        run: ./mvnw -B -q -DskipTests package

      - name: Start backend
        working-directory: backend
        run: nohup java -jar target/*.jar > backend.log 2>&1 &

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8080/v3/api-docs; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become ready in time"
          cat backend/backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure frontend env
        working-directory: frontend
        run: cp .env.example .env

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

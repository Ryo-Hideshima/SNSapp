<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿する | SNS Mock</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-root"></div>

  <main class="page page--narrow">
    <h1 class="section-title" style="margin-top:0">投稿する</h1>
    <div class="card">
      <form id="post-form" novalidate>
        <div class="form-field">
          <label for="content">本文</label>
          <textarea id="content" name="content" rows="5" maxlength="280" required placeholder="いまどうしてる？"></textarea>
          <span class="form-hint"><span id="char-count">0</span>/280</span>
        </div>
        <div class="form-field">
          <label for="images">画像を添付（複数選択可）</label>
          <input type="file" id="images" name="images" accept="image/*" multiple>
        </div>
        <div class="image-preview" id="image-preview"></div>
        <p class="form-error" id="form-error"></p>
        <button type="submit" class="btn btn--block">投稿する</button>
      </form>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/header.js"></script>
  <script src="js/post-new.js"></script>
</body>
</html>

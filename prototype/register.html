<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新規登録 | SNS Mock</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page page--narrow">
    <div class="card auth-card">
      <h1>新規登録</h1>
      <p class="auth-card__sub">メールアドレスとパスワードで登録します</p>

      <form id="register-form" novalidate>
        <div class="form-field">
          <label for="username">ユーザー名（@username）</label>
          <input type="text" id="username" name="username" required pattern="[A-Za-z0-9_]+" placeholder="半角英数字とアンダースコア">
        </div>
        <div class="form-field">
          <label for="display-name">表示名（任意）</label>
          <input type="text" id="display-name" name="displayName" placeholder="未入力の場合はユーザー名を使用">
        </div>
        <div class="form-field">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="form-field">
          <label for="password">パスワード</label>
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
          <span class="form-hint">8文字以上で入力してください</span>
        </div>
        <p class="form-error" id="form-error"></p>
        <button type="submit" class="btn btn--block">登録する</button>
      </form>

      <p class="auth-card__footer">すでにアカウントをお持ちですか？ <a href="index.html">ログイン</a></p>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/guest-guard.js"></script>
  <script src="js/register.js"></script>
</body>
</html>

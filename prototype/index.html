<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | SNS Mock</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page page--narrow">
    <div class="card auth-card">
      <h1>ログイン</h1>
      <p class="auth-card__sub">SNS Mockへようこそ</p>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="form-field">
          <label for="password">パスワード</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <p class="form-error" id="form-error"></p>
        <button type="submit" class="btn btn--block">ログイン</button>
      </form>

      <p class="auth-card__footer">アカウントをお持ちでないですか？ <a href="register.html">新規登録</a></p>

      <div class="demo-accounts">
        デモ用アカウント（パスワード共通: <code>password</code>）<br>
        alice@example.com / bob@example.com / carol@example.com
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/guest-guard.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
